# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,qs -c noctalia-shell ipc call launcher toggle
bind=SUPER,return,spawn,ghostty

# applications
bind=SUPER,b,spawn,zen-browser
bind=SUPER+ALT,b,spawn_shell,zen-browser --private-window
bind=SUPER,y,spawn_shell,ghostty -e yazi
bind=SUPER+CTRL,t,spawn_shell,ghostty -e btop
bind=SUPER,m,spawn_shell,ghostty -e rmpc
bind=SUPER,s,spawn_shell,quicksnip
bind=SUPER,e,spawn_shell,nautilus --new-window

# noctalia shell
bind=SUPER+CTRL,space,spawn_shell,qs -c noctalia-shell ipc call bar toggle
bind=SUPER+CTRL,s,spawn_shell,qs -c noctalia-shell ipc call systemMonitor toggle
bind=SUPER+CTRL,m,spawn_shell,qs -c noctalia-shell ipc call settings toggle
bind=SUPER+CTRL,b,spawn_shell,qs -c noctalia-shell ipc call bluetooth toggle
bind=SUPER+CTRL,w,spawn_shell,qs -c noctalia-shell ipc call network toggle
bind=SUPER+CTRL,v,spawn_shell,qs -c noctalia-shell ipc call launcher clipboard

# exit
bind=SUPER+SHIFT,escape,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
bind=SUPER+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,tagtoleft,0
bind=SUPER+SHIFT,k,tagtoleft,0
bind=SUPER+SHIFT,Down,tagtoright,0
bind=SUPER+SHIFT,j,tagtoright,0
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverview,
bind=SUPER,t,togglefloating,
bind=ALT+SHIFT,f,togglefullscreen,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Up,viewtoleft,0
bind=SUPER,k,viewtoleft,0
bind=CTRL,Up,viewtoleft_have_client,0
bind=CTRL,k,viewtoleft_have_client,0
bind=SUPER,Down,viewtoright,0
bind=SUPER,j,viewtoright,0
bind=CTRL,Down,viewtoright_have_client,0
bind=CTRL,j,viewtoright_have_client,0
bind=CTRL+SUPER,Up,tagtoleft,0
bind=CTRL+SUPER,k,tagtoleft,0
bind=CTRL+SUPER,Down,tagtoright,0
bind=CTRL+SUPER,j,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

bind=Alt+Shift,1,tagsilent,1,0
bind=Alt+Shift,2,tagsilent,2,0
bind=Alt+Shift,3,tagsilent,3,0
bind=Alt+Shift,4,tagsilent,4,0
bind=Alt+Shift,5,tagsilent,5,0
bind=Alt+Shift,6,tagsilent,6,0
bind=Alt+Shift,7,tagsilent,7,0
bind=Alt+Shift,8,tagsilent,8,0
bind=Alt+Shift,9,tagsilent,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,h,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,l,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,h,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,l,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,viewtoleft_have_client
gesturebind=none,down,3,viewtoright_have_client

# 4-finger: Workspace navigation
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,qs -c noctalia-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,qs -c noctalia-shell ipc call volume muteOutput
bind=NONE,XF86AudioNext,spawn,qs -c noctalia-shell ipc call media next
bind=NONE,XF86AudioPrev,spawn,qs -c noctalia-shell ipc call media previous
bind=NONE,XF86AudioPlay,spawn,qs -c noctalia-shell ipc call media playPause
bind=NONE,XF86AudioPause,spawn,qs -c noctalia-shell ipc call media playPause
bind=NONE,XF86MonBrightnessUp,spawn,qs -c noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,qs -c noctalia-shell ipc call brightness decrease

# screenshot
bind=NONE,Print,spawn_shell, bash ~/.config/mango/script/screenshot.sh
# screen recording
bind=SUPER,r,spawn_shell,qs -c noctalia-shell ipc call plugin:screen-recorder toggle
